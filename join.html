    <link rel="icon" type="image/png" sizes="128x128" href="icon/icon-128x128.png">

    <link rel="icon" type="image/png" sizes="152x152" href="icon/icon-152x152.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192x192.png">

<body>

    <nav id="gwamble-bar" uk-navbar>
        
<button id="gwamble-close-session" onclick="closeSession()">
<i class="ri-arrow-left-s-fill"></i>
<span>Leave</span>
</button>

        <p id = "gwamble-role">
        <i class="ri-record-circle-fill"></i>
        <span>Active</span>
        </p>

        <p>
        <i class="ri-group-2-fill"></i>
        <span id = "gwamble-bet-member-ratio">0/0</span>
        </p>
    </nav>

    <div class="gwamble-post" id="posted-gwamble">
        <div class = "gwamble-post-header">
        <i class="ri-user-fill"></i>
        <span id = "gwamble-poster" ></span>
        </div>
        <h1 onclick = "window.location.reload(true)" id="gwamble-subject">Connecting...</h1>
        
        <div class="gwamble-button-container" id="outcome-a">
            <button id="gwamble-outcome-a">
                <span id="gwamble-outcome-a-text"></span>
            </button>
        </div>

        <button onclick = "placeBet('a')" class = "winner-button" id="gwamble-winner-a">
            <span class = "bet-left">Bet</span>
            <span class = "bet-right">
            <i class="ri-coins-fill"></i>
            10
            </span>
        </button>

        <div class="gwamble-button-container" id="outcome-b">
            <button id="gwamble-outcome-b">
                <span id="gwamble-outcome-b-text"></span>
            </button>
        </div>

        <button onclick = "placeBet('b')" class = "winner-button" id="gwamble-winner-b" style = "margin-bottom:0px">
            <span class = "bet-left">Bet</span>
            <span class = "bet-right">
            <i class="ri-coins-fill"></i>
            10
            </span>
        </button>

        </div>


        <div class = "gwamble-bottom">
        <button onclick = "copyGwambleCode()" id = "gwamble-share-code" data-code = ""> <i id = "gwamble-copy-icon" class="ri-file-copy-fill"></i></button>
        <button onclick = "UIkit.modal('#qr-modal').show()" id = "gwamble-qr-code"><i class="ri-qr-code-fill"></i></button>
        </div>


        <div uk-modal id="qr-modal" onclick = "UIkit.modal('#qr-modal').hide()">
            <div class="uk-modal-dialog">
                <div id="gwamble-qr-display"></div>
            </div>
        </div>

        <div id = "gwamble-leaderboard-table" style="display: none;">
            <h1>Results</h1>
            <div id = "gwamble-user-results">
            </div>
            <div id = "gwamble-leaderboard-list">
            </div>
            <button class = "gwamble-leaderboard-button" onclick = "closeSession()" >Exit Session</button>
        </div>

        <div id="message-modal" uk-modal>
            <div class="uk-modal-dialog uk-modal-body">
                <h2 class="uk-modal-title">Notification</h2>
                <p id="message-modal-text"></p>
                <p class="uk-text-right">
                    <button class="uk-button uk-button-primary uk-modal-close" type="button">OK</button>
                </p>
            </div>
        </div>

</body>
<script src="js/lib/uikit.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="js/custom/users.js"></script>
<script src="js/custom/session.js"></script>
<script src="js/custom/webrtc.js"></script>

<script>

function showWinnerUI(session) {
    const outcome = session.winner.toUpperCase();
    const persistentId = localStorage.getItem('gwamble_persistent_user_id');
    const myBet = session.bets.find(b => b.user_id === persistentId);
    const didIWin = myBet?.selected_outcome.toUpperCase() === outcome;

    const winner_post = document.getElementById('outcome-'+outcome.toLowerCase());
    const winner_button = document.getElementById('gwamble-winner-'+outcome.toLowerCase());
    const loser_post = document.getElementById('outcome-'+(outcome.toLowerCase() === 'a' ? 'b' : 'a'));
    const loser_button = document.getElementById('gwamble-winner-'+(outcome.toLowerCase() === 'a' ? 'b' : 'a'));

    if(loser_post) loser_post.remove();
    if(loser_button) loser_button.remove();

    if(winner_post) {
        winner_post.classList.add('animate__animated', 'animate__tada');
    }
    if(winner_button) {
        winner_button.style.marginBottom = "0px";
    }

    const bottomBar = document.querySelector('.gwamble-bottom');
    if (bottomBar) bottomBar.remove();
    
    const topBar = document.getElementById('gwamble-bar');
    if(topBar) topBar.style.display = "none";

    const postedGwamble = document.getElementById('posted-gwamble');
    if(postedGwamble) postedGwamble.style.marginTop = "20px";

    const resultsTable = document.getElementById('gwamble-leaderboard-table');
    resultsTable.style.display = 'flex';

    const userResults = document.getElementById('gwamble-user-results');
    if (myBet) {
        if (didIWin) {
            userResults.innerHTML = `<p><i class="ri-trophy-fill" style="margin-right:5px"></i> You won! Payout: 20 coins.</p>`;
        } else {
            userResults.innerHTML = `<p><i class="ri-close-circle-fill" style="margin-right:5px"></i> You lost. Better luck next time.</p>`;
        }
    } else {
        userResults.innerHTML = `<p>You didn't place a bet.</p>`;
    }

    const leaderboardList = document.getElementById('gwamble-leaderboard-list');
    leaderboardList.innerHTML = ''; // Clear previous results
    session.members.forEach(member => {
        const bet = session.bets.find(b => b.user_id === member.persistent_id);
        const betText = bet ? `Bet on Outcome ${bet.selected_outcome.toUpperCase()}` : 'Did not bet';
        const winnerClass = bet && bet.selected_outcome.toUpperCase() === outcome ? 'winner-trophy' : '';

        const memberItem = `
            <div class="member-item">
                <div class="gwamble-topper">
                    <span style="font-family:'Manrope';font-size:18px">${member.username}</span>
                    ${winnerClass ? '<i class="ri-trophy-fill"></i>' : ''}
                </div>
                <span style="opacity:50%;font-size:14px">${betText}</span>
            </div>
        `;
        leaderboardList.innerHTML += memberItem;
    });
}

function updateUI(session) {
    if (!session) return;

    if (session.winner) {
        showWinnerUI(session);
        return;
    }

    document.getElementById('gwamble-subject').innerHTML = session.subject;
    document.getElementById('gwamble-outcome-a-text').innerHTML = session.outcomeA;
    document.getElementById('gwamble-outcome-b-text').innerHTML = session.outcomeB;
    document.getElementById('gwamble-poster').innerHTML = session.hostUsername;
    
    const code = sessionStorage.getItem('gwamble_join_code');
    const codeButton = document.getElementById('gwamble-share-code');
    const formattedCode = `${code.slice(0,3)}-${code.slice(3,6)}`;
    codeButton.setAttribute('data-code', formattedCode);
    codeButton.firstChild.nodeValue = formattedCode + ' ';

    generateQRCode(code);

    const memberCount = session.members ? session.members.length : 0;
    const betCount = session.bets ? session.bets.length : 0;
    document.getElementById('gwamble-bet-member-ratio').textContent = `${betCount}/${memberCount}`;

    // Check if the current user has already placed a bet and update UI accordingly
    const persistentId = localStorage.getItem('gwamble_persistent_user_id');
    if (session.bets && persistentId) {
        const myBet = session.bets.find(b => b.user_id === persistentId);
        if (myBet) {
            lockInBetUI(myBet.selected_outcome);
        }
    }
}

function showMessageModal(message) {
    const modalText = document.getElementById('message-modal-text');
    if (modalText) {
        modalText.textContent = message;
        const modal = UIkit.modal('#message-modal');
        if (modal) {
            modal.show();
        }
    }
}

function lockInBetUI(outcome) {
    const buttonA = document.getElementById('gwamble-winner-a');
    const buttonB = document.getElementById('gwamble-winner-b');
    const titleA = document.getElementById('gwamble-outcome-a');
    const titleB = document.getElementById('gwamble-outcome-b');
    buttonA.disabled = true;
    buttonB.disabled = true;
    titleA.disabled = true;
    titleB.disabled = true;
    titleA.style.pointerEvents = 'none';
    titleB.style.pointerEvents = 'none';
    buttonA.style.pointerEvents = 'none';
    buttonB.style.pointerEvents = 'none';
    buttonA.style.opacity = '0.5';
    buttonB.style.opacity = '0.5';
    titleA.style.opacity = '0.5';
    titleB.style.opacity = '0.5';

    if (outcome) {
        const selectedButton = document.getElementById(`gwamble-winner-${outcome.toLowerCase()}`);
        const selectedTitle = document.getElementById(`gwamble-outcome-${outcome.toLowerCase()}`);
        if (selectedButton) {
            selectedButton.innerHTML = '<div class="bet-left">Bet placed!</div><div class="bet-right"><i class="ri-coins-fill"></i> 10</div>';
            selectedTitle.disabled = false;
            selectedTitle.style.opacity = '1';
            selectedButton.style.opacity = '1';
        }
    }
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('code');

    if (hostId) {
        sessionStorage.setItem('gwamble_join_code', hostId);
        sessionStorage.setItem('gwamble_role', 'peer');
        // joinSession is in webrtc.js, it will handle connecting and receiving data.
        // It will also call updateUI when data is received.
        joinSession(hostId, updateUI, showMessageModal);
    } else {
        document.getElementById('gwamble-subject').innerHTML = "Error: No join code provided.";
    }
};

function placeBet(outcome) {
    // This function will be in webrtc.js to send the bet to the host
    sendBet(outcome);
    lockInBetUI(outcome);
}

function closeSession() {
    // Disconnect from peerjs and cleanup
    disconnectFromHost(); 
    sessionStorage.clear();
    window.location.replace('index.html');
}

function copyGwambleCode() {
    var code = document.getElementById('gwamble-share-code').getAttribute('data-code');
    navigator.clipboard.writeText(code);

    var icon = document.getElementById('gwamble-copy-icon');
    icon.classList.remove('ri-file-copy-fill');
    icon.classList.add('ri-check-fill');
    setTimeout(function() {
        icon.classList.remove('ri-check-fill');
        icon.classList.add('ri-file-copy-fill');
    }, 2500);
}

function generateQRCode(code) {
    document.getElementById("gwamble-qr-display").innerHTML = '';
    var qr = new QRCode(document.getElementById("gwamble-qr-display"), {
        text: code,
        width: 256,
        height: 256,
    });
}

</script>

</html>
