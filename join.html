function updateUI(session) {
    if (!session) return;

    if (session.winner) {
        showWinnerUI(session);
        return;
    }

    document.getElementById('gwamble-subject').innerHTML = session.subject;
    document.getElementById('gwamble-outcome-a-text').innerHTML = session.outcomeA;
    document.getElementById('gwamble-outcome-b-text').innerHTML = session.outcomeB;
    document.getElementById('gwamble-poster').innerHTML = session.hostUsername;
    
    const code = sessionStorage.getItem('gwamble_join_code');
    const codeButton = document.getElementById('gwamble-share-code');
    const formattedCode = `${code.slice(0,3)}-${code.slice(3,6)}`;
    codeButton.setAttribute('data-code', formattedCode);
    codeButton.firstChild.nodeValue = formattedCode + ' ';

    generateQRCode(code);

    const memberCount = session.members ? session.members.length : 0;
    const betCount = session.bets ? session.bets.length : 0;
    document.getElementById('gwamble-bet-member-ratio').textContent = `${betCount}/${memberCount}`;

    // Check if the current user has already placed a bet and update UI accordingly
    const persistentId = localStorage.getItem('gwamble_persistent_user_id');
    if (session.bets && persistentId) {
        const myBet = session.bets.find(b => b.user_id === persistentId);
        if (myBet) {
            lockInBetUI(myBet.selected_outcome);
        }
    }
}

function showMessageModal(message) {
    const modalText = document.getElementById('message-modal-text');
    if (modalText) {
        modalText.textContent = message;
        const modal = UIkit.modal('#message-modal');
        if (modal) {
            modal.show();
        }
    }
}

function lockInBetUI(outcome) {
    const buttonA = document.getElementById('gwamble-winner-a');
    const buttonB = document.getElementById('gwamble-winner-b');
    const titleA = document.getElementById('gwamble-outcome-a');
    const titleB = document.getElementById('gwamble-outcome-b');
    buttonA.disabled = true;
    buttonB.disabled = true;
    titleA.disabled = true;
    titleB.disabled = true;
    titleA.style.pointerEvents = 'none';
    titleB.style.pointerEvents = 'none';
    buttonA.style.pointerEvents = 'none';
    buttonB.style.pointerEvents = 'none';
    buttonA.style.opacity = '0.5';
    buttonB.style.opacity = '0.5';
    titleA.style.opacity = '0.5';
    titleB.style.opacity = '0.5';

    if (outcome) {
        const selectedButton = document.getElementById(`gwamble-winner-${outcome.toLowerCase()}`);
        const selectedTitle = document.getElementById(`gwamble-outcome-${outcome.toLowerCase()}`);
        if (selectedButton) {
            selectedButton.innerHTML = '<div class="bet-left">Bet placed!</div><div class="bet-right"><i class="ri-coins-fill"></i> 10</div>';
            selectedTitle.disabled = false;
            selectedTitle.style.opacity = '1';
            selectedButton.style.opacity = '1';
        }
    }
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('code');

    if (hostId) {
        sessionStorage.setItem('gwamble_join_code', hostId);
        sessionStorage.setItem('gwamble_role', 'peer');
        // joinSession is in webrtc.js, it will handle connecting and receiving data.
        // It will also call updateUI when data is received.
        joinSession(hostId, updateUI, showMessageModal);
    } else {
        document.getElementById('gwamble-subject').innerHTML = "Error: No join code provided.";
    }
};

function placeBet(outcome) {
    console.log('placeBet called with outcome:', outcome);
    
    // FORCE IMMEDIATE CREDIT DEDUCTION HERE TOO
    let user = JSON.parse(localStorage.getItem('gwambleUser') || '{}');
    const currentCredits = user.credits || 100;
    
    console.log('Current credits before bet:', currentCredits);
    
    if (currentCredits < 10) {
        alert("Not enough credits to bet");
        return;
    }
    
    // Deduct credits immediately
    user.credits = Math.max(currentCredits - 10, 10);
    localStorage.setItem('gwambleUser', JSON.stringify(user));
    console.log(`PLACEBELT: Deducted 10 credits. ${currentCredits} -> ${user.credits}`);
    console.log('Updated localStorage:', localStorage.getItem('gwambleUser'));
    
    // This function will be in webrtc.js to send the bet to the host
    sendBet(outcome);
    lockInBetUI(outcome);
}

function closeSession() {
    // Disconnect from peerjs and cleanup
    disconnectFromHost(); 
    sessionStorage.clear();
    window.location.replace('index.html');
}

function copyGwambleCode() {
    var code = document.getElementById('gwamble-share-code').getAttribute('data-code');
    navigator.clipboard.writeText(code);

    var icon = document.getElementById('gwamble-copy-icon');
    icon.classList.remove('ri-file-copy-fill');
    icon.classList.add('ri-check-fill');
    setTimeout(function() {
        icon.classList.remove('ri-check-fill');
        icon.classList.add('ri-file_COPY-fill');
    }, 2500);
}

function generateQRCode(code) {
    document.getElementById("gwamble-qr-display").innerHTML = '';
    var qr = new QRCode(document.getElementById("gwamble-qr-display"), {
        text: code,
        width: 256,
        height: 256,
    });
}
