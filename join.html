<!DOCTYPE html>
<html>
<head>
    <title>Joining Gwamble...</title>
    <link rel="stylesheet" type="text/css" href="css/lib/remixicon.css">
    <link rel="stylesheet" type="text/css" href="css/custom/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        #loading-icon {
            width: 64px;
            margin: 10px;
            filter: blur(0.5px);
        }
    </style>
</head>
<body>
    <div id="gwamble-body">
        <h1>Joining Gwamble...</h1>
        <img src="icon/loading2.gif" id="loading-icon" alt="Loading...">
        <p>Please wait while we connect you to the session.</p>
        <p>If you are not redirected automatically, the session may no longer be active or the code is incorrect.</p>
        <button onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <script src="js/custom/webrtc.js"></script>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const hostId = urlParams.get('code');

            if (hostId) {
                // The joinAndRedirect function from webrtc.js will handle everything
                joinAndRedirect(hostId);
            } else {
                alert('No join code provided.');
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
