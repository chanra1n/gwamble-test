<!DOCTYPE html>
<html>
<head>
    <title>GWAMBLE - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/lib/remixicon.css">
    <link rel="stylesheet" type="text/css" href="css/lib/uikit.css">
    <link rel="stylesheet" type="text/css" href="css/custom/index.css">
    <link rel="stylesheet" type="text/css" href="css/custom/session.css">
    <link rel="stylesheet" type="text/css" href="css/custom/profile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body>
    <nav id="gwamble-bar" uk-navbar>
        <button id="gwamble-close-session" onclick="window.location.href='index.html'">
            <i class="ri-arrow-left-s-fill"></i>
            <span>Back</span>
        </button>
        <h1>Profile</h1>
            <!-- Credits container moved to top right of page -->
        <div class="credits-display">
            <i class="ri-coins-fill"></i>
            <span id="user-credits"></span>
        </div>
    </nav>

    <div id="gwamble-body">
        <div class="profile-card">
            <div class="profile-edit">
                <!-- Removed credits-container from here -->
                <div class="input-group">
                    <label for="username-input" class="small-title">Display Name</label>
                    <input type="text" id="username-input" maxlength="20">
                </div>
                <button id="save-username-button" class="gwamble-button-bottom" disabled>
                    <i class="ri-save-fill"></i>
                    <span>Save</span>
                </button>
            </div>
            <span id="save-notification" class="save-notification"></span>
            <p class="profile-id">Your profile is local to this device.</p>
        </div>
    </div>

    <!-- Static UIkit modal for profile notifications -->
    <div id="gwamble-uikit-modal" uk-modal class="uk-modal">
        <div class="uk-modal-dialog uk-modal-body uk-margin-auto-vertical" style="border-radius:16px; min-width:260px; max-width:90vw; text-align:center;">
            <div id="gwamble-uikit-modal-content"></div>
            <button class="uk-button uk-button-default" type="button" id="gwamble-uikit-modal-close">
                <i class="ri-check-fill"></i>
                <span>OK</span>
            </button>
        </div>
    </div>

    <script src="js/custom/users.js"></script>
    <script src="js/lib/uikit.js"></script>
    <script>
        function initProfile() {
            const user = getLocalUser();
            const usernameInput = document.getElementById('username-input');
            const userCredits = document.getElementById('user-credits');
            const saveButton = document.getElementById('save-username-button');
            const saveNotification = document.getElementById('save-notification');

            if (user) {
                usernameInput.value = user.username;
                userCredits.textContent = user.credits;
            }

            usernameInput.addEventListener('input', () => {
                const newUsername = usernameInput.value.trim();
                const currentUsername = user.username;
                saveButton.disabled = newUsername === '' || newUsername === currentUsername;
            });

            saveButton.addEventListener('click', () => {
                const newUsername = usernameInput.value.trim();
                if (newUsername.length > 0 && newUsername !== user.username) {
                    updateUsername(newUsername);
                    user.username = newUsername; // Update local copy for UI state
                    saveButton.disabled = true;

                    // Update and show static UIkit modal
                    document.getElementById('gwamble-uikit-modal-content').innerHTML = `Username updated!`;
                    UIkit.modal('#gwamble-uikit-modal').show();
                }
            });
            document.getElementById('gwamble-uikit-modal-close').onclick = () => {
                UIkit.modal('#gwamble-uikit-modal').hide();
            };
        }
        window.onload = initProfile;
    </script>
</body>
</html>
