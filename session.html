<body>

    <nav id="gwamble-bar" uk-navbar>
        
<button id="gwamble-close-session" onclick="closeSession()">
<i class="ri-arrow-left-s-fill"></i>

    <div class="gwamble-post" id="posted-gwamble">

        <button onclick="declareWinner('B')" class="winner-button" id="gwamble-winner-b" style="margin-bottom: 0px; display: none; border-radius: 0px 0px 15px 15px">

<script src="js/lib/uikit.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="js/custom/getActions.js"></script>
<script src="js/custom/webrtc.js"></script>

<script>

var gwamble_session;

// NEW: This is the host-only entry point for the session page.
window.onload = function() {
    // 1. Verify this user is the host. If not, redirect them immediately.
    if (sessionStorage.getItem('isHost') !== 'true') {
        alert('This page is for the session host only.');
        window.location.replace('index.html');
        return; // Stop all further execution.
    }

    // 2. Verify essential session data exists.
    const sessionData = sessionStorage.getItem('gwamble');
    if (!sessionData) {
        alert('FATAL: No session data found. Returning to home page.');
        window.location.replace('index.html');
        return;
    }
    gwamble_session = JSON.parse(sessionData);
    // Ensure members and bets arrays exist, just in case.
    if (!gwamble_session.members) gwamble_session.members = [];
    if (!gwamble_session.bets) gwamble_session.bets = [];


    // 3. Set up Host UI and network connection.
    console.log("Role determined: HOST. Setting up host UI and connection.");
    document.getElementById('gwamble-winner-a').style.display = 'flex';
    document.getElementById('gwamble-winner-b').style.display = 'flex';
    
    // Disable betting buttons for the host
    document.getElementById('gwamble-outcome-a').onclick = null;
    document.getElementById('gwamble-outcome-b').onclick = null;
    document.getElementById('gwamble-outcome-a').style.cursor = 'default';
    document.getElementById('gwamble-outcome-b').style.cursor = 'default';

    reestablishHostConnection();

    // 4. Set up common UI elements.
    setupHostUI();

    // 5. Activate the global message listener.
    window.addEventListener('gwamble-message', handleGwambleMessage);
};

// Sets up the initial UI elements for the host.
function setupHostUI() {
    console.log("Setting up host UI elements.");
    document.getElementById('gwamble-subject').innerHTML = gwamble_session.subject;
    document.getElementById('gwamble-poster').innerHTML = gwamble_session.hostUsername;
    document.getElementById('gwamble-outcome-a-text').innerHTML = gwamble_session.outcomeA;
    document.getElementById('gwamble-outcome-b-text').innerHTML = gwamble_session.outcomeB;

    const joinCode = sessionStorage.getItem('gwamble_join_code');
    if (joinCode) {
        const shareCodeButton = document.getElementById('gwamble-share-code');
        const formattedCode = joinCode.substring(0, 3) + ' - ' + joinCode.substring(3);
        shareCodeButton.setAttribute('data-code', formattedCode);
        shareCodeButton.firstChild.nodeValue = formattedCode + ' ';
        const codeWithLink = window.location.origin + '/join.html?code=' + joinCode;
        generateQRCode(codeWithLink);
    }
}

// Host's function to declare a winner.
function declareWinner(outcome) {
    console.log(`Host declared winner: ${outcome}`);
    
    // Update local session state
    gwamble_session.winner = outcome;
    sessionStorage.setItem('gwamble', JSON.stringify(gwamble_session));

    // 1. Broadcast the winner declaration to all peers
    broadcastMessage({ type: 'winner-declared', payload: { winner: outcome } });

    // 2. Update the host's own UI
    showWinnerUI(gwamble_session);
}

function showWinnerUI(session) {
    const outcome = session.winner.toUpperCase();
    
    const winner_post = document.getElementById('outcome-'+outcome.toLowerCase());
    const winner_button = document.getElementById('gwamble-winner-'+outcome.toLowerCase());
    const loser_post = document.getElementById('outcome-'+(outcome.toLowerCase() === 'a' ? 'b' : 'a'));
    const loser_button = document.getElementById('gwamble-winner-'+(outcome.toLowerCase() === 'a' ? 'b' : 'a'));

    if (loser_post) loser_post.remove();
    if (loser_button) loser_button.remove();

    if (winner_post) {
        winner_post.classList.add('animate__animated', 'animate__tada');
    }
    if (winner_button) {
        winner_button.style.marginBottom = "0px";
        winner_button.innerHTML = `
        
        <div class="bet-left">
        Settled!
        </div>
        <div class="bet-right">
        <i class="ri-check-double-fill"></i>
        </div>
        
        `;
        winner_button.style.opacity = "0.5";
        winner_button.style.pointerEvents = "none";
    }

    const bottomBar = document.querySelector('.gwamble-bottom');
    if (bottomBar) bottomBar.remove();
    
    const topBar = document.getElementById('gwamble-bar');
    if (topBar) {
        topBar.style.display = "none";
    }
    
    const postedGwamble = document.getElementById('posted-gwamble');
    if (postedGwamble) postedGwamble.style.marginTop = "20px";

    const leaderboardTable = document.getElementById('gwamble-leaderboard-table');
    leaderboardTable.style.display = "flex";

    // Populate leaderboard
    const leaderboardList = document.getElementById('gwamble-leaderboard-list');
    leaderboardList.innerHTML = '';

    // Host doesn't see win/loss message, just results
    document.getElementById('gwamble-user-results').style.display = 'none';

    if (!session.bets || session.bets.length === 0) {
        leaderboardTable.querySelector('h1').style.display = 'none';
        leaderboardList.innerHTML = `
            <div class="member-item" style="width:100%;opacity:50%">
                <div class="gwamble-topper">
                    <span style="font-family:'Lexend';font-size:18px">No bets were received.</span>
                </div>
            </div>`;
        return;
    }

    session.members.forEach(member => {
        const bet = session.bets.find(b => b.user_id === member.persistent_id || b.user_id === member.user_id);
        const isWinner = bet && bet.selected_outcome.toUpperCase() === outcome;
        const winnerClass = isWinner ? 'winner-trophy' : '';
        const betText = bet ? `Bet on Outcome ${bet.selected_outcome.toUpperCase()}` : 'Did not bet';

        const memberItem = `
            <div class="member-item">
                <div class="gwamble-topper">
                    <span style="font-family:'Manrope';font-size:18px">${member.username}</span>
                    ${winnerClass ? '<i class="ri-trophy-fill"></i>' : ''}
                </div>
                <span style="opacity:50%;font-size:14px">${betText}</span>
            </div>
        `;
        leaderboardList.innerHTML += memberItem;
    });
}

// Host's function to close the session for everyone.
function closeSession() {
    broadcastMessage({ type: 'session-closed' });
    if (peer) peer.destroy();
    sessionStorage.clear();
    window.location.replace('index.html');
}

// Host's function to kick a peer.
function kickPeer(peerId, username) {
    if (confirm(`Are you sure you want to kick ${username}?`)) {
        console.log(`Host is kicking peer: ${peerId}`);
        kickPeerConnection(peerId); // This function is in webrtc.js
    }
}

// Handles all messages coming from webrtc.js
function handleGwambleMessage(event) {
    const message = event.detail;
    console.log('Received message in UI:', message);

    let sessionUpdated = false;

    switch (message.type) {
        case 'host-ready':
            if (!gwamble_session.members.find(m => m.user_id === message.payload.peerId)) {
                gwamble_session.members.push({ 
                    user_id: message.payload.peerId, 
                    username: message.payload.username, 
                    is_host: true 
                });
                sessionUpdated = true;
            }
            break;
        case 'user-joined':
            if (!gwamble_session.members.find(m => m.user_id === message.payload.peerId)) {
                gwamble_session.members.push({ 
                    user_id: message.payload.peerId, 
                    username: message.payload.username, 
                    is_host: false 
                });
                sessionUpdated = true;
            }
            break;
        case 'user-left':
            const initialMemberCount = gwamble_session.members.length;
            gwamble_session.members = gwamble_session.members.filter(m => m.user_id !== message.payload.peerId);
            if (gwamble_session.members.length < initialMemberCount) {
                sessionUpdated = true;
            }
            break;
        case 'bets-updated':
            gwamble_session.bets = message.payload.bets;
            updateBetDisplay();
            break;
    }

    if (sessionUpdated) {
        sessionStorage.setItem('gwamble', JSON.stringify(gwamble_session));
        redrawMemberList();
        updateMemberCount();
    }
}

// Redraws the entire member list modal from the session object.
function redrawMemberList() {
    const memberList = document.getElementById('member-modal-list');
    memberList.innerHTML = ''; // Clear the list

    gwamble_session.members.forEach(member => {
        const memberItem = document.createElement('div');
        memberItem.className = 'member-item';
        memberItem.id = `member-${member.user_id}`;

        let rightSideContent = '';
        if (member.is_host) {
            rightSideContent = '<i class="ri-vip-crown-fill host-icon"></i>';
        } else {
            rightSideContent = `<button class="gwamble-kick-button" onclick="kickPeer('${member.user_id}', '${member.username}')"><i class="ri-indeterminate-circle-fill"></i></button>`;
        }

        memberItem.innerHTML = `
            <i class="ri-user-fill"></i>
            <span class="member-username">${member.username}</span>
            ${rightSideContent}
        `;
        memberList.appendChild(memberItem);
    });
}

// Updates the main member count display.
function updateMemberCount() {
    const memberCount = gwamble_session.members ? gwamble_session.members.length : 0;
    const betCount = gwamble_session.bets ? gwamble_session.bets.length : 0;
    document.getElementById('gwamble-bet-member-ratio').textContent = `${betCount}/${memberCount}`;
}

// Updates the bet counts displayed under each outcome.
function updateBetDisplay() {
    gwamble_session.bets = gwamble_session.bets || [];
    let outcomeABets = 0;
    let outcomeBBets = 0;
    gwamble_session.bets.forEach(bet => {
        if (bet.selected_outcome === 'a' || bet.selected_outcome === 'A') {
            outcomeABets++;
        } else if (bet.selected_outcome === 'b' || bet.selected_outcome === 'B') {
            outcomeBBets++;
        }
    });
    document.getElementById('gwamble-outcome-a-bets').textContent = outcomeABets;
    document.getElementById('gwamble-outcome-b-bets').textContent = outcomeBBets;
    updateMemberCount(); // Also update the main ratio
}

function copyGwambleCode() {
    var code = document.getElementById('gwamble-share-code').getAttribute('data-code');
    navigator.clipboard.writeText(code.replace('-', ''));
    var icon = document.getElementById('gwamble-copy-icon');
    icon.classList.remove('ri-file-copy-fill');
    icon.classList.add('ri-check-fill');
    setTimeout(function() {
        icon.classList.remove('ri-check-fill');
        icon.classList.add('ri-file-copy-fill');
    }, 2500);
}

function generateQRCode(code) {
    document.getElementById("gwamble-qr-display").innerHTML = '';
    new QRCode(document.getElementById("gwamble-qr-display"), {
        text: code,
        width: 256,
        height: 256,
    });
}

</script>
