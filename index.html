<body>
    <nav id="gwamble-bar" uk-navbar>
        <i class="ri-loop-right-fill" id="reload-icon" onclick="reloadPage()"></i>

    <div id="gwamble-body">
        <div id="gwamble-options-container">
            <div id="create-gwamble-container" class="gwamble-option" onclick="createGwamble()">

                    <span class="small-title">Outcome A</span>
                    <input autocomplete="false" type="text" placeholder="..." maxlength="20">
     
                    <span class="small-title">Outcome B</span>
                    <input autocomplete="false" style="margin-bottom:20px" type="text" placeholder="..." maxlength="20">
     
                    <div class = "button-group">

                    <button id="cancel-gwamble-post-button" onclick="closeCreateGwamble()" class="cancel">

                    </button>
                    <button id="create-gwamble-post-button" disabled onclick="passGwamble()">

                </button>
                </div>
            </div>

            <div id="join-gwamble-container" class="gwamble-option" onclick="joinGwamble()">
                <span class="hidden-while-displayed">Join a gwamble</span>

                <div id="join-gwamble-options">
                    <span class="small-title" style="margin-bottom:10px">Enter code</span>
                    <div class="mb-6 text-center">
                        <div id="otp" class="flex justify-center">
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="first" maxlength="1" />
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="second" maxlength="1"  />
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="third" maxlength="1"  />
                          <p class="input-hyphen">-</p>
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="fourth" maxlength="1" />
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="fifth" maxlength="1"  />
                          <input class="m-2 text-center form-control form-control-solid rounded focus:border-blue-400 focus:shadow-outline" type="number" id="sixth" maxlength="1"  />
                        </div>
                      </div>
     
                <div class = "button-group">

                    <button onclick="closeJoinGwamble()" class="cancel">
                    <i class="ri-close-fill"></i>
                    </button>
                    <button onclick="joinGwambleSession()">

</body>
<script src="js/lib/uikit.js"></script>

<script>

    var create_gwamble_is_triggered = false;
    var join_gwamble_is_triggered = false;

    function createGwamble() {
        console.log("create gwamble");
        const createContainer = document.getElementById('create-gwamble-container');
        const createOptions = document.getElementById('create-gwamble-options');
        const hiddenElements = document.getElementsByClassName('hidden-while-displayed');
        document.getElementById('join-gwamble-container').style.display = "none";


        for (var i = 0; i < hiddenElements.length; i++) {
            hiddenElements[i].style.display = "none";
        }

        setTimeout(function () {
            createOptions.style.opacity = "1"; // Ensure opacity is set correctly
            createOptions.style.pointerEvents = "all";
            // Ensure the container's height can expand
            createContainer.style.height = "auto";
            createOptions.style.display = "flex";
            createContainer.onclick = null;
        }, 1);
        create_gwamble_is_triggered = true;

    }

    function closeCreateGwamble() {
        console.log("close create gwamble");
        const createContainer = document.getElementById('create-gwamble-container');
        const createOptions = document.getElementById('create-gwamble-options');
        const hiddenElements = document.getElementsByClassName('hidden-while-displayed');

        createOptions.style.opacity = "0";
        createOptions.style.display = "none";

        for (var i = 0; i < hiddenElements.length; i++) {
            hiddenElements[i].style.display = "flex";
        }

        setTimeout(function () {
            createContainer.classList.remove('open'); // Remove class to trigger transition
            document.getElementById('join-gwamble-container').style.display = "flex";
            // clear all the inputs
            document.getElementById('create-gwamble-subject').value = "";
            document.getElementById('create-gwamble-options').querySelectorAll('input').forEach(input => input.value = "");
            createContainer.onclick = function () {
                createGwamble();
            };
        }, 1);
        create_gwamble_is_triggered = false;
    }

    function joinGwamble() {
        console.log("join gwamble");
        const joinContainer = document.getElementById('join-gwamble-container');
        const joinOptions = document.getElementById('join-gwamble-options');
        const hiddenElements = document.getElementsByClassName('hidden-while-displayed');
        document.getElementById('create-gwamble-container').style.display = "none";

        for (var i = 0; i < hiddenElements.length; i++) {
            hiddenElements[i].style.display = "none";
        }

        setTimeout(function () {
            joinOptions.style.opacity = "1"; // Ensure opacity is set correctly
            joinOptions.style.pointerEvents = "all";
            // Ensure the container's height can expand
            joinContainer.style.height = "auto";
            joinOptions.style.display = "flex";
            joinContainer.onclick = null;
        }, 1);
        join_gwamble_is_triggered = true;
    }

    function closeJoinGwamble() {
        console.log("close join gwamble");
        const joinContainer = document.getElementById('join-gwamble-container');
        const joinOptions = document.getElementById('join-gwamble-options');
        const hiddenElements = document.getElementsByClassName('hidden-while-displayed');

        joinOptions.style.opacity = "0";
        joinOptions.style.display = "none";

        for (var i = 0; i < hiddenElements.length; i++) {
            hiddenElements[i].style.display = "flex";
        }

        setTimeout(function () {
            joinContainer.classList.remove('open'); // Remove class to trigger transition
            document.getElementById('create-gwamble-container').style.display = "flex";
            joinContainer.onclick = function () {
                joinGwamble();
            };
        }, 1);
        join_gwamble_is_triggered = false;
    }

    function OTPInput() {
  const inputs = document.querySelectorAll('#otp > *[id]');
  for (let i = 0; i < inputs.length; i++) {
    inputs[i].setAttribute('inputmode', 'numeric');
    inputs[i].setAttribute('maxlength', '1');
    inputs[i].addEventListener('keydown', function(event) {
      if (event.key === "Backspace") {
        inputs[i].value = '';
        if (i !== 0)
          inputs[i - 1].focus();
      } else if (event.key.length === 1 && !/\d/.test(event.key)) {
        event.preventDefault();
      } else {
        if (i === inputs.length - 1 && inputs[i].value !== '') {
          return true;
        } else if (/\d/.test(event.key)) {
          inputs[i].value = event.key;
          if (i !== inputs.length - 1)
            inputs[i + 1].focus();
          event.preventDefault();
        }
      }
    });
    inputs[i].addEventListener('input', function(event) {
      // Only allow one digit
      this.value = this.value.replace(/[^\d]/g, '').slice(0, 1);
      if (this.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
    });
  }
  // Paste event for the whole OTP container
  document.getElementById('otp').addEventListener('paste', function(e) {
    e.preventDefault();
    let paste = (e.clipboardData || window.clipboardData).getData('text');
    paste = paste.replace(/[^\d]/g, '').slice(0, inputs.length);
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].value = paste[i] || '';
    }
    if (paste.length > 0) {
      const next = Math.min(paste.length, inputs.length) - 1;
      inputs[next].focus();
    }
  });
}

    function reloadPage(){
    console.log('APP resumed');
    window.location.reload();
}

    function passGwamble() {
        var subject = document.getElementById('create-gwamble-subject').value;
        var outcomeA = document.getElementById('create-gwamble-options').querySelectorAll('input')[0].value;
        var outcomeB = document.getElementById('create-gwamble-options').querySelectorAll('input')[1].value;
        var user = getLocalUser();
        var join_code = generateJoinCode();

        // Using camelCase properties to match the GwambleSession class
        var session = new GwambleSession(user.token, user.username, subject, outcomeA, outcomeB);
        sessionStorage.setItem('gwamble', JSON.stringify(session));
        sessionStorage.setItem('gwamble_join_code', join_code);
        sessionStorage.setItem('gwamble_username', user.username);

        // Initialize the host via WebRTC and redirect upon successful connection.
        initializeHostAndRedirect(join_code);
    }

    // let's set an even listener for the inputs and textareas inside the create-gwamble-options.
    // onchange, we will check if all the inputs/textareas have values, if they do, we will enable the post button
    // if they don't, we will disable the post button

    function initCreateGwambleListeners() {
        const createGwambleOptions = document.getElementById('create-gwamble-options');
        const createGwamblePostButton = document.getElementById('create-gwamble-post-button');

        createGwambleOptions.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('input', function () {
                const allInputsHaveValues = Array.from(createGwambleOptions.querySelectorAll('input, textarea')).every(input => input.value.trim());
                createGwamblePostButton.disabled = !allInputsHaveValues;
            });
        });
    }


    function joinGwambleSession() {
        const inputs = document.querySelectorAll('#otp > *[id]');
        let code = '';
        inputs.forEach(input => {
            code += input.value;
        });

        if (code.length !== 6) {
            alert("Please enter a 6-digit code.");
            return;
        }

        const joinButton = document.querySelector('#join-gwamble-options button[onclick="joinGwambleSession()"]');
        const joinButtonSpan = joinButton.querySelector('span');
        const joinButtonIcon = joinButton.querySelector('i');

        // Disable button and show loading state
        joinButton.disabled = true;
        document.getElementById('join-gwamble-container').style.pointerEvents = 'none';
        document.getElementById('join-gwamble-container').style.opacity = '0.5';
        joinButton.innerHTML = '<i class="ri-loader-4-fill" style="animation: spin 1s linear infinite;"></i>';

        validateJoinCode(code,
            () => { // onSuccess
                // Validation successful, proceed to join page
                sessionStorage.setItem('gwamble_join_code', code);
                sessionStorage.setItem('gwamble_role', 'peer');
                window.location.href = 'join.html?code=' + code;
            },
            (error) => { // onError
                // Validation failed, show error and re-enable button
                alert(error.message);
                joinButton.disabled = false;
                joinButtonSpan.textContent = 'Join';
                joinButtonIcon.className = 'ri-check-fill';
                document.getElementById('join-gwamble-container').style.pointerEvents = 'all';
                document.getElementById('join-gwamble-container').style.opacity = '1';

                inputs.forEach(input => input.value = ''); // Clear inputs

                joinButton.innerHTML = '<i class="ri-check-fill"></i> <span>Join</span>';
            }
        );
    }

    function verifyCode(code) {
       // This function is no longer reliable for cross-browser validation.
       // The connection logic in join.html will handle invalid codes.
       return true;
    }

    function generateJoinCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    window.onload = function() {
        // Clear any previous session state to ensure a clean start every time.
        sessionStorage.removeItem('gwamble');
        sessionStorage.removeItem('gwamble_join_code');
        sessionStorage.removeItem('isHost');
        sessionStorage.removeItem('myPeerId');
        sessionStorage.removeItem('hostPeerId');

        OTPInput();
        initCreateGwambleListeners();
        window.scrollTo(0, 0);
    };

</script>
